name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o DentalLabSuite_Local.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build both apps
        run: |
          PROJECT_DIR="."
          if [ -d "DentalLabSuite" ] && [ -f "DentalLabSuite/gradlew" ]; then
            PROJECT_DIR="DentalLabSuite"
          elif [ -f "gradlew" ]; then
            PROJECT_DIR="."
          else
            FOUND_GRADLEW=$(find . -maxdepth 3 -name "gradlew" -type f | head -n 1)
            if [ -n "$FOUND_GRADLEW" ]; then
              PROJECT_DIR=$(dirname "$FOUND_GRADLEW")
            fi
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :clinic:assembleDebug :lab:assembleDebug

      - name: Upload clinic APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: clinic-apk
          path: "**/clinic/build/outputs/apk/debug/*.apk"

      - name: Upload lab APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lab-apk
          path: "**/lab/build/outputs/apk/debug/*.apk"
